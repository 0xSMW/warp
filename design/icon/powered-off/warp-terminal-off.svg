<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Warp CRT powered-off icon — editable vector master</title>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0.25" y2="1">
      <stop stop-color="#f1f3f4"/><stop offset=".32" stop-color="#d6d9dc"/><stop offset=".7" stop-color="#a1a5aa"/><stop offset="1" stop-color="#85898e"/>
    </linearGradient>
    <linearGradient id="rimHighlight" x2="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".45"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".12"/><stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="innerMetal" x2="0" y2="1">
      <stop stop-color="#747474"/><stop offset=".5" stop-color="#626262"/><stop offset="1" stop-color="#484848"/>
    </linearGradient>
    <linearGradient id="bezel" x2="0" y2="1">
      <stop stop-color="#222222"/><stop offset=".45" stop-color="#202020"/><stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="insetShade" x2="0" y2="1">
      <stop stop-color="#000000" stop-opacity=".8"/><stop offset=".35" stop-color="#000000" stop-opacity=".28"/><stop offset=".5" stop-color="#000000" stop-opacity=".243076923"/><stop offset="1" stop-color="#000000" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="offGlass" x2="0" y2="1">
      <stop stop-color="#171717"/><stop offset=".48" stop-color="#0d0d0d"/><stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="glass" x2=".1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".12"/><stop offset="1" stop-color="#ffffff" stop-opacity=".015"/>
    </linearGradient>
    <pattern id="pixels" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 0H6M0 0V6" fill="none" stroke="#000000" stroke-width="1" stroke-opacity=".12"/>
      <path d="M2 1V5" stroke="#d5d5d5" stroke-width="1" stroke-opacity=".025"/>
    </pattern>
    <clipPath id="screenClip"><rect x="148" y="148" width="728" height="728" rx="130"/></clipPath>
    <clipPath id="bevelClip"><rect x="96.2" y="96.2" width="831.6" height="831.6" rx="165.8"/></clipPath>
    <filter id="bevelSoftness" x="-.1" y="-.1" width="1.2" height="1.2" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <g id="canvas-fit" transform="translate(512 512) scale(0.9285714285714286) translate(-512 -512)">
  <g id="metal-frame" aria-label="Metal frame">
    <rect x="64" y="64" width="896" height="896" rx="196" fill="url(#metal)"/>
    <rect x="67" y="67" width="890" height="890" rx="193" fill="none" stroke="url(#rimHighlight)" stroke-width="3"/>
    <rect x="96.2" y="96.2" width="831.6" height="831.6" rx="165.8" fill="url(#innerMetal)"/>
  </g>
  <g id="inset-bezel" aria-label="Inset bezel" clip-path="url(#bevelClip)">
    <rect x="105" y="105" width="814" height="814" rx="157" fill="url(#bezel)" filter="url(#bevelSoftness)"/>
    <rect x="146" y="146" width="732" height="732" rx="132" fill="none" stroke="url(#insetShade)" stroke-width="12" filter="url(#bevelSoftness)"/>
  </g>
  <g id="screen" aria-label="Powered-off glass" clip-path="url(#screenClip)">
    <rect x="148" y="148" width="728" height="728" fill="url(#offGlass)"/>
    <g id="screen-texture"><rect x="148" y="148" width="728" height="728" fill="url(#pixels)"/></g>
    <g id="glass-reflection"><path d="M148 148H876V326C774 430 429 372 148 440Z" fill="url(#glass)"/></g>
  </g>
  </g>
</svg>
